<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Εταιρικές Υπηρεσίες Ψηφιακής Υποδομής & Εκδηλώσεων</title>
  <meta name="description" content="Ολοκληρωμένη υποστήριξη εταιρικής επικοινωνίας, marketing και εκδηλώσεων από έναν συνεργάτη.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main>
    <section class="section">
      <div class="container two-col">
        <div>
          <p class="kicker">Επικοινωνία</p>
          <h1>Προγραμματίστε συνάντηση με την ομάδα μας</h1>
          <p>Συμπληρώστε τη φόρμα και θα οργανώσουμε σύντομη συζήτηση για το έργο σας.</p>
          <p><strong>Τηλέφωνο:</strong> <a href="tel:+302105910100">+30 210 5910100</a></p>
          <p><strong>Email:</strong> <a href="mailto:zamanis.gr@gmail.com">zamanis.gr@gmail.com</a></p>
        </div>
        <form class="contact-form card" id="contactForm">
          <div>
            <label for="company">Εταιρεία</label>
            <input id="company" name="company" required>
          </div>
          <div>
            <label for="role">Ρόλος</label>
            <input id="role" name="role" required>
          </div>
          <div>
            <label for="projectType">Τύπος έργου</label>
            <input id="projectType" name="projectType" required>
          </div>
          <div>
            <label for="timeline">Χρονοδιάγραμμα</label>
            <input id="timeline" name="timeline" required>
          </div>
          <div>
            <label for="message">Μήνυμα</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Αποστολή</button>
          <p id="formSuccess" class="form-success">Θα επικοινωνήσουμε εντός μίας εργάσιμης ημέρας.</p>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/main.js"></script>
</body>
</html>
